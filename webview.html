<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <style>
            body {
                background-color: rgb(200, 27, 27);
                width: 200px;
                color: white;
            }

            img {
                width: 200px;
                height: auto;
            }

            .extension_option {
                background-color: rgb(132, 8, 8);
                border-radius: 5px;
                padding: 5px;
                margin-bottom: 5px;
                font-weight: bold;
            }
        </style>

        <script type="module" src="webview.js"></script>
    </head>
    <body>
        <img src="logo.png">
        <hr>
        <p>Mājaslapu uzlabošanas pakalpojumi kopš 2025.g</p>
        <div class="option_container">
            <div class="extension_option">
                <input id="jak_checkbox" type="checkbox">
                <label for="jak_checkbox">JAK/JTTEHNIKUMS</label>
            </div>
            <div class="extension_option">
                <input id="gnomio_checkbox" type="checkbox">
                <label for="gnomio_checkbox">GNOMIO</label>
            </div>
            <div class="extension_option">
                <input id="uzdevumilv_checkbox" type="checkbox">
                <label for="uzdevumilv_checkbox">UZDEVUMI.LV</label>
                <input id="uzdevumilv_api_key" type="text">
                <label for="uzdevumilv_api_key">KEY</label>
                <div>
                    <input id="uzdevumilv_choice_gemini" type="radio">
                    <label for="uzdevumilv_choice_gemini">GEMINI</label>
                    <input id="uzdevumilv_choice_gamma" type="radio">
                    <label for="uzdevumilv_choice_gamma">GAMMA</label>
                </div>
            </div>
        </div>
    </body>
</html>
